apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-web.fullname" . }}
  labels:
    {{- include "agent-web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agent-web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-web.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: web
          image: {{ include "agent-web.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AGENT_BRAIN_API_URL
              value: {{ .Values.agentBrain.apiUrl | quote }}
            - name: NGINX_LISTEN_PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
