# Run from this directory:
#   docker compose up -d
#   open http://localhost:3000
#
# Point at a remote API:
#   AGENT_BRAIN_API_URL=https://agent-brain.example.com docker compose up -d

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    environment:
      AGENT_BRAIN_API_URL: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
