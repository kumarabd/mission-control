name: Web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "design/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "design/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
